name: Build and Push Itotko Image

on:
  push:
    branches:
      - master
      - develop

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image name
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "IMAGE=itotko" >> $GITHUB_OUTPUT
          else
            echo "IMAGE=dev-itotko" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true

          cache-from: type=gha
          cache-to: type=gha,mode=max

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.vars.outputs.IMAGE }}:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.vars.outputs.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
